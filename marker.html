<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="description" content="Hiro marker display for the AR exhibit." />
  <title>Hiro Marker</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <style>
    :root {
      --bg: #06131f;
      --panel: rgba(12, 24, 39, 0.9);
      --panel-border: rgba(148, 163, 184, 0.25);
      --text: #edf6ff;
      --muted: #a7c3d8;
      --accent: #67e8f9;
      --shadow: rgba(6, 19, 31, 0.45);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
      background: radial-gradient(circle at top, #0f2137 0%, var(--bg) 55%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    body {
      padding: 28px;
      overflow-x: hidden;
      max-width: 100vw;
    }

    .page-shell {
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      padding: 16px 20px;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      background: rgba(9, 19, 30, 0.7);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px var(--shadow);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .brand-logo {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(103, 232, 249, 0.4);
      display: block;
    }

    .nav {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .nav a {
      color: var(--muted);
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid transparent;
      transition: 0.2s ease;
    }

    .nav a:hover {
      border-color: var(--panel-border);
      color: var(--text);
    }

    .marker-card {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 32px 28px;
      border-radius: 24px;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      box-shadow: 0 18px 45px var(--shadow);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.08;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 1.02rem;
    }

    .marker-image {
      display: block;
      width: min(420px, 82%);
      margin: 0 auto 22px;
      border-radius: 18px;
      padding: 18px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.06);
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button.primary {
      background: linear-gradient(135deg, #67e8f9, #60a5fa);
      color: #071822;
      box-shadow: 0 12px 24px rgba(103, 232, 249, 0.25);
    }

    .button.secondary {
      background: transparent;
      border: 1px solid var(--panel-border);
      color: var(--text);
    }

    @media (orientation: landscape) and (max-width: 960px) {
      body {
        padding: 12px;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
      }

      .page-shell {
        width: 100%;
      }

      .topbar {
        padding: 12px 14px;
      }

      .nav {
        display: none;
      }

      .brand span {
        font-size: 1rem;
      }

      .marker-card {
        padding: 24px 16px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="./favicon.svg" alt="AR Hiro Exhibit logo" />
        <span>Hiro Exhibit</span>
      </div>
      <nav class="nav">
        <a href="./index.html">AR App</a>
        <a href="./marker.html">Marker</a>
      </nav>
    </header>

    <main class="marker-card">
      <p class="eyebrow">Step 1</p>
      <h1>Show this Hiro marker</h1>
      <p>
        Open the AR app on the phone, then hold the laptop screen so the camera sees the marker below.
        The phone will detect the image and display the 3D scene.
      </p>

      <img
        class="marker-image"
        src="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png"
        alt="Hiro AR marker"
      />

      <div class="actions">
        <a class="button primary" href="./index.html">Open AR app</a>
        <a class="button secondary" href="./index.html#scene">Jump to scene</a>
      </div>
    </main>
  </div>

  <script>
    function lockPortraitOrientation() {
      if (screen.orientation && typeof screen.orientation.lock === 'function') {
        screen.orientation.lock('portrait').catch(function () {
          // Some browsers block orientation locking without a user gesture.
        });
      }
    }

    document.addEventListener('touchstart', lockPortraitOrientation, { once: true });
    document.addEventListener('click', lockPortraitOrientation, { once: true });
  </script>
</body>
</html>
