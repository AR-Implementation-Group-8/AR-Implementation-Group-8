<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hiro Marker</title>
  <style>
    :root {
      --bg: #071822;
      --panel: rgba(11, 24, 36, 0.88);
      --panel-border: rgba(148, 163, 184, 0.25);
      --text: #eef7ff;
      --muted: #b8ccdc;
      --accent: #67e8f9;
      --shadow: rgba(4, 10, 15, 0.48);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #122d40 0%, var(--bg) 55%);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .marker-card {
      width: min(760px, 100%);
      padding: 32px 28px;
      border-radius: 24px;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      box-shadow: 0 18px 45px var(--shadow);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.08;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 1.02rem;
    }

    .marker-image {
      display: block;
      width: min(420px, 82%);
      margin: 0 auto 22px;
      border-radius: 18px;
      padding: 18px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.06);
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button.primary {
      background: linear-gradient(135deg, #67e8f9, #60a5fa);
      color: #071822;
      box-shadow: 0 12px 24px rgba(103, 232, 249, 0.25);
    }

    .button.secondary {
      background: transparent;
      border: 1px solid var(--panel-border);
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="marker-card">
    <p class="eyebrow">Step 1</p>
    <h1>Show this Hiro marker</h1>
    <p>
      Open the AR app on the phone, then hold the laptop screen so the camera sees the marker below.
      The phone will detect the image and display the 3D scene.
    </p>

    <img
      class="marker-image"
      src="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png"
      alt="Hiro AR marker"
    />

    <div class="actions">
      <a class="button primary" href="./index.html">Open AR app</a>
      <a class="button secondary" href="./index.html#scene">Jump to scene</a>
    </div>
  </main>
</body>
</html>
