<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hiro Marker AR Scene</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #0f172a;
    }

    .status-banner {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      min-width: 220px;
      padding: 10px 18px;
      border-radius: 999px;
      color: #e2e8f0;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.5);
      text-align: center;
      font: 700 14px/1.2 Arial, sans-serif;
      letter-spacing: 0.04em;
      z-index: 10;
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.25);
    }
  </style>
</head>
<body>
  <div id="status-banner" class="status-banner">Marker searching...</div>

  <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker id="hiro-marker" preset="hiro">
      <a-box position="0 0.4 0" scale="1.8 0.25 1.8" material="color: #2dd4bf; opacity: 0.9"></a-box>

      <a-sphere position="-0.8 1.2 0.2" radius="0.35" material="color: #f97316"
        animation="property: position; dir: alternate; to: -0.8 1.45 0.2; dur: 900; loop: true; easing: easeInOutSine" color-cycle>
      </a-sphere>

      <a-cylinder position="0.8 0.9 0.15" radius="0.3" height="1.8" material="color: #facc15" toggle-grow></a-cylinder>

      <a-torus position="0 1.7 -0.5" radius="0.8" tube="0.12" material="color: #38bdf8"
        animation="property: rotation; to: 0 360 0; dur: 5000; loop: true; easing: linear"></a-torus>

      <a-entity gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/BoxTextured/glTF-Binary/BoxTextured.glb"
        position="1.4 1.1 -0.8" scale="0.35 0.35 0.35"
        animation="property: rotation; to: 0 360 0; dur: 4000; loop: true; easing: linear"></a-entity>

      <a-text value="HIRO LAB" position="0 2.4 0.15" align="center" color="#f8fafc" width="6" anchor="center"
        font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
    </a-marker>

    <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: [clickable]"></a-entity>
  </a-scene>

  <script>
    AFRAME.registerComponent('color-cycle', {
      init: function () {
        const colors = ['#f97316', '#f43f5e', '#22c55e', '#38bdf8', '#a78bfa'];
        let currentIndex = 0;

        this.el.setAttribute('class', 'clickable');
        this.el.addEventListener('click', () => {
          currentIndex = (currentIndex + 1) % colors.length;
          this.el.setAttribute('material', 'color', colors[currentIndex]);
        });
      }
    });

    AFRAME.registerComponent('toggle-grow', {
      init: function () {
        this.growing = false;
        this.el.setAttribute('class', 'clickable');
        this.el.addEventListener('click', () => {
          this.growing = !this.growing;
          const scale = this.growing ? 1.7 : 1.0;
          this.el.setAttribute('scale', { x: scale, y: scale, z: scale });
        });
      }
    });

    const banner = document.getElementById('status-banner');
    const marker = document.getElementById('hiro-marker');

    marker.addEventListener('markerFound', () => {
      banner.textContent = 'Marker found';
      banner.style.background = 'rgba(34, 197, 94, 0.9)';
      banner.style.color = '#052e16';
      banner.style.borderColor = 'rgba(134, 239, 172, 0.9)';
    });

    marker.addEventListener('markerLost', () => {
      banner.textContent = 'Marker lost';
      banner.style.background = 'rgba(239, 68, 68, 0.9)';
      banner.style.color = '#fff1f2';
      banner.style.borderColor = 'rgba(254, 202, 202, 0.9)';
    });
  </script>
</body>
</html>
